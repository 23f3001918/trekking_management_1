{% extends 'base.html' %}
{% block content %}
<div class="dashboard-container">
    <aside class="sidebar">
        <h2 class="logo">Trekker</h2>
        <ul>
            <li>
                <a href="{{ url_for('user_dashboard') }}">Dashboard</a>
            </li>

            <li>
                <a href="{{ url_for('user_view_treks') }}">Browse Treks</a>
            </li>

            <li>
                <a href="{{ url_for('user_bookings') }}">My Bookings</a>
            </li>

            <li>
                <a href="{{ url_for('trek_history') }}">History</a>
            </li>

            <li class="active">
                <a href="{{ url_for('user_profile') }}">Profile</a>
            </li>

            <li>
                <a href="{{ url_for('logout') }}">Logout</a>
            </li>
        </ul>
    </aside>

    <div class="main-content">
        <header class="topbar">
            <h2>Trekking Management Application</h2>
            <div class="admin-info">
                {{ session['name'] }}
            </div>
        </header>

        <div class="content">
            <h1>My Profile</h1>
            <p class="subtitle">
                View and update your personal information.
            </p>

            <div class="form-card">
                <form method="POST"
                      action="{{ url_for('update_profile') }}">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Full Name</label>
                            <input
                                type="text"
                                name="name"
                                value="{{ user.name }}"
                                readonly>
                        </div>

                        <div class="form-group">
                            <label>Email Address</label>
                            <input
                                type="email"
                                value="{{ user.email }}"
                                required>
                        </div>

                        <div class="form-group">
                            <label>Phone Number</label>
                            <input
                                type="text"
                                name="phone"
                                value="{{ user.phone }}"
                                required>
                        </div>

                        <div class="form-group">
                            <label>Role</label>
                            <input
                                type="text"
                                value="{{ user.role|capitalize }}"
                                readonly>
                        </div>
                    </div>

                    <div class="button-group">
                        <button
                            type="submit"
                            class="save-btn">
                            Update Profile
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
