{% extends "base.html" %}
{% block content %}
<div class="dashboard-container">
    <aside class="sidebar">
        <h2 class="logo">🏔 Trek Staff</h2>
        <ul>
            <li>
                <a href="{{ url_for('staff_dashboard') }}">Dashboard</a>
            </li>

            <li class="active">
                <a href="{{ url_for('assigned_treks') }}">My Treks</a>
            </li>

            <li>
                <a href="{{ url_for('staff_profile') }}">Profile</a>
            </li>

            <li>
                <a href="{{ url_for('logout') }}">Logout</a>
            </li>
        </ul>
    </aside>

    <div class="main-content">
        <header class="topbar">
            <h2>Trekking Management Application</h2>
            <div class="admin-info">
                 Staff
            </div>
        </header>

        <div class="content">
            <div class="form-card">
                <h2>Update Available Slots</h2>
                <form method="POST">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Trek Name</label>
                            <input
                                type="text"
                                value="{{ trek.name }}"
                                readonly>
                        </div>

                        <div class="form-group">
                            <label>Location</label>
                            <input
                                type="text"
                                value="{{ trek.location }}"
                                readonly>
                        </div>

                        <div class="form-group">
                            <label>Total Slots</label>
                            <input
                                type="number"
                                value="{{ trek.total_slots }}"
                                readonly>
                        </div>

                        <div class="form-group">
                            <label>Current Available Slots</label>
                            <input
                                type="number"
                                value="{{ trek.available_slots }}"
                                readonly>
                        </div>

                        <div class="form-group full-width">
                            <label>New Available Slots</label>
                            <input
                                type="number"
                                name="available_slots"
                                value="{{ trek.available_slots }}"
                                min="0"
                                max="{{ trek.total_slots }}"
                                required>
                        </div>
                    </div>

                    <div class="button-group">
                        <a href="{{ url_for('trek_details', trek_id=trek.id) }}"
                           class="cancel-btn">
                            Cancel
                        </a>

                        <button
                            type="submit"
                            class="save-btn">
                            Update Slots
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
