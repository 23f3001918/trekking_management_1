{% extends 'base.html' %}
{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <h2>Staff Registration</h2>
        <p class="subtitle">
            Register as a Trek Staff member.
        </p>
        <form method="POST" action="{{ url_for('staff_register') }}">
            <input
                type="text"
                name="name"
                placeholder="Full Name"
                required>

            <input
                type="email"
                name="email"
                placeholder="Email Address"
                required>

            <input
                type="password"
                name="password"
                placeholder="Password"
                required>

            <input
                type="text"
                name="phone"
                placeholder="Phone Number"
                required>

            <input
                type="number"
                name="experience_years"
                placeholder="Experience (in years)"
                min="0"
                required>

            <button type="submit">
                Register as Staff
            </button>
        </form>

        <div class="auth-links">
            <p>
                Already have an account?
                <a href="{{ url_for('login') }}">Login</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
