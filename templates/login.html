{% extends 'base.html' %}
{% block content %}
<div class="login-header">
    <h1> Trekking Management System</h1>
    <p>Adventure Begins Here</p>
    </div>

<div class="auth-page">
    <div class="auth-card">
        <h2>Login</h2>
        <form method="POST">
            <input type="email"
                   name="email"
                   placeholder="Email"
                   required>

            <input type="password"
                   name="password"
                   placeholder="Password"
                   required>

            <button type="submit">
                Login
            </button>
        </form>

        <p>
            Don't have an account?
        </p>

        <div class="auth-links">
            <a href="{{ url_for('register') }}">Register as Trekker</a>
            |
            <a href="{{ url_for('staff_register') }}">Register as Staff</a>
        </div>
    </div>
</div>
{% endblock %}
