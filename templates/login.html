{% extends 'base.html' %}
{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <h2>Login</h2>
        <form method="POST">
            <input type="email"
                   name="email"
                   placeholder="Email"
                   required>

            <input type="password"
                   name="password"
                   placeholder="Password"
                   required>

            <div class="remember-row">
                <input type="checkbox" name="remember">
                <label>Remember me</label>
            </div>

            <button type="submit">
                Login
            </button>
        </form>

        <p>
            Don't have an account?
        </p>

        <div class="auth-links">
            <a href="{{ url_for('register') }}">Register as Trekker</a>
            |
            <a href="{{ url_for('staff_register') }}">Register as Staff</a>
        </div>
    </div>
</div>
{% endblock %}
