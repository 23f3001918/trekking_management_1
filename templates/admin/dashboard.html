{% extends 'base.html' %}

{% block title %}
Admin Dashboard
{% endblock %}

{% block content %}

<h1 class="page-title">Admin Dashboard</h1>

<div class="stats-container">

    <div class="stat-card">
        <h3>Total Treks</h3>
        <p>{{ total_treks }}</p>
    </div>

    <div class="stat-card">
        <h3>Total Users</h3>
        <p>{{ total_users }}</p>
    </div>

    <div class="stat-card">
        <h3>Total Staff</h3>
        <p>{{ total_staff }}</p>
    </div>

    <div class="stat-card">
        <h3>Total Bookings</h3>
        <p>{{ total_bookings }}</p>
    </div>

</div>

{% endblock %}
