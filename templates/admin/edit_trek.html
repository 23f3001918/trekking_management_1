{% extends "base.html" %}
{% block content %}

<div class="dashboard-container">
    <aside class="sidebar">
        <h2 class="logo"> Trek Admin</h2>
        <ul>

            <li><a href="{{ url_for('admin_dashboard') }}">Dashboard</a></li>
            <li class="active">
                <a href="{{ url_for('view_treks') }}">Treks</a>
            </li>
            <li><a href="{{ url_for('view_staff') }}">Staff</a></li>
            <li><a href="{{ url_for('view_users') }}">Users</a></li>
            <li><a href="{{ url_for('view_bookings') }}">Bookings</a></li>
            <li><a href="{{ url_for('search') }}">Search</a></li>
            <li><a href="{{ url_for('trekking_history') }}">Reports</a></li>
            <li><a href="{{ url_for('logout') }}">Logout</a></li>
        </ul>
    </aside>

    <div class="main-content">
        <header class="topbar">
            <h2>Trekking Management Application</h2>
            <div class="admin-info">
                 Admin
            </div>
        </header>

        <div class="content">
            <div class="form-card">
                <h2>Edit Trek</h2>
                <form method="POST">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Trek Name</label>
                            <input
                                type="text"
                                name="name"
                                value="{{ trek.name }}"
                                required>
                        </div>

                        <div class="form-group">
                            <label>Location</label>
                            <input
                                type="text"
                                name="location"
                                value="{{ trek.location }}"
                                required>
                        </div>

                        <div class="form-group">
                            <label>Difficulty</label>
                            <select name="difficulty" required>
                                <option value="Easy"
                                {% if trek.difficulty=="Easy" %}selected{% endif %}>
                                    Easy
                                </option>

                                <option value="Moderate"
                                {% if trek.difficulty=="Moderate" %}selected{% endif %}>
                                    Moderate
                                </option>

                                <option value="Hard"
                                {% if trek.difficulty=="Hard" %}selected{% endif %}>
                                    Hard
                                </option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>Duration (Days)</label>
                            <input
                                type="number"
                                name="duration_days"
                                value="{{ trek.duration_days }}"
                                required>
                        </div>

                        <div class="form-group">
                            <label>Total Slots</label>
                            <input
                                type="number"
                                name="total_slots"
                                value="{{ trek.total_slots }}"
                                required>
                        </div>

                        <div class="form-group">
                            <label>Available Slots</label>
                            <input
                                type="number"
                                name="available_slots"
                                value="{{ trek.available_slots }}"
                                required>
                        </div>

                        <div class="form-group">
                            <label>Price (₹)</label>
                            <input
                                type="number"
                                name="price"
                                value="{{ trek.price }}"
                                required>
                        </div>

                        <div class="form-group">
                            <label>Start Date</label>
                            <input
                                type="date"
                                name="start_date"
                                value="{{ trek.start_date }}"
                                required>
                        </div>

                        <div class="form-group">
                            <label>End Date</label>
                            <input
                                type="date"
                                name="end_date"
                                value="{{ trek.end_date }}"
                                required>
                        </div>

                        <div class="form-group full-width">
                            <label>Description</label>
                            <textarea
                                name="description"
                                rows="5"
                                required>{{ trek.description }}</textarea>
                        </div>
                    </div>

                    <div class="button-group">
                        <a href="{{ url_for('view_treks') }}"class="cancel-btn">Cancel</a>
                        <button
                            type="submit"
                            class="save-btn">
                            Update Trek
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
